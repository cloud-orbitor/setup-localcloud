name: Qualify optional OCI image cache
on:
  workflow_call:
    inputs:
      image:
        type: string
        default: agentcloud/localcloud@sha256:88e85b86b294e1e4f71b8c63ec43de79d170946ff39556f0e2709f66aa0d368c
      runner:
        type: string
        default: ubuntu-24.04
  workflow_dispatch:
    inputs:
      image:
        description: Immutable runtime image
        default: agentcloud/localcloud@sha256:88e85b86b294e1e4f71b8c63ec43de79d170946ff39556f0e2709f66aa0d368c
      runner:
        description: Linux runner architecture
        type: choice
        options: [ubuntu-24.04, ubuntu-24.04-arm]
        default: ubuntu-24.04
permissions:
  contents: read
jobs:
  warm:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    env:
      LOCALCLOUD_CACHE_IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - id: key
        run: |
          identity=$(printf '%s' "$LOCALCLOUD_CACHE_IMAGE" | sha256sum | cut -d ' ' -f 1)
          printf 'key=localcloud-oci-v1-%s-%s-%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$identity" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: restored
        with:
          path: .local-test/oci-cache
          key: ${{ steps.key.outputs.key }}
      - run: sudo apt-get update && sudo apt-get install -y skopeo
        if: steps.restored.outputs.cache-hit != 'true'
      - name: Build a verified platform cache on a cold miss
        if: steps.restored.outputs.cache-hit != 'true'
        run: node scripts/image-cache.mjs "$LOCALCLOUD_CACHE_IMAGE" .local-test/oci-cache
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.restored.outputs.cache-hit != 'true'
        with:
          path: .local-test/oci-cache
          key: ${{ steps.key.outputs.key }}
  restore:
    needs: warm
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      INPUT_IMAGE: ${{ inputs.image }}
      INPUT_SERVICES: gcs,pubsub,bigquery
      LOCALCLOUD_QUALIFICATION_REPORT: .local-test/cache-restore.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .local-test/oci-cache
          key: ${{ needs.warm.outputs.cache-key }}
          fail-on-cache-miss: true
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - run: python -m pip install -r examples/requirements.txt
      - name: Prove a fresh runner can start without a registry pull
        run: node scripts/qualify.mjs --image-cache=.local-test/oci-cache --offline-cache
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cache-restore-evidence
          path: .local-test/cache-restore.json
          include-hidden-files: true
