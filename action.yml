name: LocalCloud for GitHub Actions
description: Start a LocalCloud Docker environment and configure supported Google Cloud SDKs for integration tests.
author: LocalCloud
branding:
  icon: cloud
  color: blue
inputs:
  image:
    description: LocalCloud image pinned to an immutable digest. Used when starting a container.
    default: agentcloud/localcloud@sha256:88e85b86b294e1e4f71b8c63ec43de79d170946ff39556f0e2709f66aa0d368c
  image-cache:
    description: Optional restored OCI image layout created by scripts/image-cache.mjs. The pinned source and platform are verified before use.
  services:
    description: Comma-separated service IDs. The release profile is gcs,pubsub,bigquery.
    default: gcs,pubsub,bigquery
  project-id:
    description: Local Google Cloud project to create or select.
    default: localcloud-ci
  runtime-url:
    description: Existing local HTTP gateway. Leave empty for automatic Docker startup and loopback port mapping.
  port-map:
    description: JSON canonical-to-published port map for an existing runtime, for example '{"5380":15380,"5383":15383}'.
    default: '{}'
  docker-access:
    description: Opt in to runner Docker socket access for native execution. Creates an isolated network and owned data volume; grants the runtime access to the runner Docker host.
    default: 'false'
  mcp:
    description: Generate a job-local read-only MCP stdio configuration attached to this runtime and project. No CLI or second runtime is installed.
    default: 'false'
  timeout:
    description: Maximum seconds to wait for selected-service readiness.
    default: '120'
outputs:
  runtime-url:
    description: Reachable LocalCloud gateway URL.
  container-id:
    description: Action-owned container ID, or empty for an existing runtime.
  project-id:
    description: Selected local project ID.
  network:
    description: Action-owned Docker network for application containers, or empty for an existing runtime.
  env-file:
    description: Job-local SDK environment file for processes on the runner.
  docker-env-file:
    description: SDK environment file using internal endpoints on the action-owned network, or empty for an existing runtime.
  mcp-url:
    description: Existing runtime MCP endpoint when MCP is enabled.
  mcp-config:
    description: Job-local MCP client configuration file when MCP is enabled.
runs:
  using: node24
  main: src/main.mjs
  post: src/post.mjs
  post-if: always()
